<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  
  <defs>
    <linearGradient id="g1" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#16A34A"/><stop offset="1" stop-color="#22C55E"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#22C55E"/><stop offset="1" stop-color="#6EE05A"/>
    </linearGradient>
    <linearGradient id="g3" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#6EE05A"/><stop offset="1" stop-color="#B8FF3C"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.92" r="0.75">
      <stop offset="0" stop-color="#22C55E" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#22C55E" stop-opacity="0"/>
