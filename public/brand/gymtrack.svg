  <g transform="translate(129.79 191.19) scale(1.2531)">
  <g>
    <!--
      G: el arco abre arriba a la derecha y baja hasta el espolón. Sin ese
      espolón vertical bajo el travesaño, la letra se lee como una "e".
    -->
    <path
      d="M 306 150 A 150 150 0 1 0 330 331"
      fill="none" stroke="#FFFFFF" stroke-width="62"
      stroke-linecap="round" stroke-linejoin="round"/>
    <path
      d="M 262 256 L 330 256 L 330 334"
      fill="none" stroke="#FFFFFF" stroke-width="62"
      stroke-linecap="round" stroke-linejoin="round"/>

    <!-- barras de progreso, con una leve inclinación que les da movimiento -->
    <g transform="translate(392 246) skewX(-9)">
      <rect x="0"   y="30"  width="36" height="92"  rx="18" fill="url(#g1)"/>
      <rect x="56"  y="-28" width="36" height="150" rx="18" fill="url(#g2)"/>
      <rect x="112" y="-96" width="36" height="218" rx="18" fill="url(#g3)"/>
    </g>
  </g></g>
